[package]
name = "ck-launcher-core"
version = "0.2.0-beta.1"
edition = "2021"
rust-version = "1.90"
description = "Minecraft launcher services independent of the user interface"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
futures-util = "0.3"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
sha1 = "0.10"
tokio = { version = "1", features = ["macros", "io-util", "io-std", "net", "process", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
url = "2"
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Globalization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }

tempfile = "3.23"
semver = "1"
